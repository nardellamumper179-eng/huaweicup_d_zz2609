    <text style="fill:#555a60;font-family:SimHei;font-size:11px;font-stretch:normal;font-style:normal;font-weight:normal;text-anchor:middle;" transform="rotate(-0, 108.288, 54.755177)" x="108.288" y="54.755177">任务与分区</text>
   </g>
   <g id="text_2">
    <text style="fill:#555a60;font-family:SimHei;font-size:11px;font-stretch:normal;font-style:normal;font-weight:normal;text-anchor:middle;" transform="rotate(-0, 304.704, 54.798146)" x="304.704" y="54.798146">固定编号核算</text>
   </g>
   <g id="text_3">
    <text style="fill:#555a60;font-family:SimHei;font-size:11px;font-stretch:normal;font-style:normal;font-weight:normal;text-anchor:middle;" transform="rotate(-0, 501.12, 54.798146)" x="501.12" y="54.798146">组内重派核算</text>
   </g>
   <g id="text_4">
    <text style="fill:#555a60;font-family:SimHei;font-size:11px;font-stretch:normal;font-style:normal;font-weight:normal;text-anchor:middle;" transform="rotate(-0, 697.536, 54.776662)" x="697.536" y="54.776662">方案选择</text>
   </g>
   <g id="text_5">
    <text style="fill:#555a60;font-family:SimHei;font-size:11px;font-stretch:normal;font-style:normal;font-weight:normal;text-anchor:middle;" transform="rotate(-0, 893.952, 54.733693)" x="893.952" y="54.733693">检查与比较</text>
   </g>
   <g id="text_6">
    <text style="fill:#66727c;font-family:SimHei;font-size:10px;font-stretch:normal;font-style:normal;font-weight:normal;text-anchor:middle;" transform="rotate(-0, 501.12, 382.05468)" x="501.12" y="382.05468">固定编号与组内重派为两种分别核算的口径；25%均衡条件为附加比较，不是题目硬约束。</text>
   </g>
   <g id="text_7">
    <text style="fill:#30343a;font-family:SimHei;font-size:10px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(58.288 109.476461)">固定第三问路线、时刻</text>
    <text style="fill:#30343a;font-family:SimHei;font-size:10px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(73.288 120.353024)">机型与通信关系</text>
   </g>
   <g id="text_8">
    <text style="fill:#30343a;font-family:SimHei;font-size:10px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(53.288 199.875606)">合并共同运输或中继任务</text>
    <text style="fill:#30343a;font-family:SimHei;font-size:10px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(60.788 210.942794)">得到7个不可拆分单元</text>
   </g>
   <g id="text_9">
    <text style="fill:#30343a;font-family:SimHei;font-size:10px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(63.288 290.133736)">枚举非空、无序分组</text>
    <text style="fill:#30343a;font-family:SimHei;font-size:10px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(60.788 301.439204)">两组63种；三组301种</text>
   </g>
   <g id="text_10">
    <text style="fill:#30343a;font-family:SimHei;font-size:10px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(259.704 109.381149)">每组统计原执行设备</text>
    <text style="fill:#30343a;font-family:SimHei;font-size:10px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(269.704 120.448336)">及能源组件编号</text>
   </g>
   <g id="text_11">
    <text style="fill:#30343a;font-family:SimHei;font-size:10px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(254.704 199.836544)">同编号若出现在不同组</text>
    <text style="fill:#30343a;font-family:SimHei;font-size:10px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(264.704 210.903731)">各组分别配置实物</text>
   </g>
   <g id="text_12">
    <text style="fill:#30343a;font-family:SimHei;font-size:10px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(269.704 290.326704)">汇总各类型需求</text>
    <text style="fill:#30343a;font-family:SimHei;font-size:10px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(269.704 301.441548)">与现有库存比较</text>
   </g>
   <g id="text_13">
    <text style="fill:#30343a;font-family:SimHei;font-size:10px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(461.12 109.279196)">分别建立各类资源</text>
    <text style="fill:#30343a;font-family:SimHei;font-size:10px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(441.12 120.394039)">飞行、充电或周转占用区间</text>
   </g>
   <g id="text_14">
    <text style="fill:#30343a;font-family:SimHei;font-size:10px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(446.12 199.851778)">按开始时刻安排同类设备</text>
    <text style="fill:#30343a;font-family:SimHei;font-size:10px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(456.12 210.966622)">已释放设备优先复用</text>
   </g>
   <g id="text_15">
    <text style="fill:#30343a;font-family:SimHei;font-size:10px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(466.12 290.268111)">求各组最少需求</text>
    <text style="fill:#30343a;font-family:SimHei;font-size:10px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(456.12 301.382954)">汇总各类型库存缺口</text>
   </g>
